name: Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'migrations/**'
      - 'src/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tisearch-production
  cancel-in-progress: false
jobs:
  deploy:
    # Enable after configuring this repository's own D1 ID and runtime credentials.
    if: vars.TI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run format:check
      - name: Check production configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo '::error::Replace the TI D1 database ID before deployment.'
            exit 1
          fi
      - run: bun run deploy
