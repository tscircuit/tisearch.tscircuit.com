name = "tisearch"
account_id = "0f355c6f0542dd04cc3fc370c67366a2"
main = "src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "tisearch.tscircuit.com", custom_domain = true }
]

[vars]
TI_CATALOG_POPULATION_ENABLED = "false"
TI_CURRENCY = "USD"
TI_CACHE_TTL_SECONDS = "86400"
TI_STALE_TTL_SECONDS = "604800"
TI_MIN_REMAINING = "25"

[[d1_databases]]
binding = "DB"
database_name = "tisearch"
database_id = "555e3eac-a06e-4057-9110-93cabcbbaac7"
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *", "*/15 * * * *"]

[[durable_objects.bindings]]
name = "TI_GATEWAY"
class_name = "TiGateway"

[[migrations]]
tag = "v1-ti-gateway"
new_sqlite_classes = ["TiGateway"]

[[r2_buckets]]
binding = "TI_CATALOG"
bucket_name = "tisearch-catalog"

[[durable_objects.bindings]]
name = "BULK_IMPORT"
class_name = "BulkCatalogImporter"

[[migrations]]
tag = "v2-bulk-catalog"
new_sqlite_classes = ["BulkCatalogImporter"]
