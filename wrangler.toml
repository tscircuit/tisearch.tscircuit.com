name = "tisearch"
main = "src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "tisearch.tscircuit.com", custom_domain = true }
]

[vars]
TI_CURRENCY = "USD"
TI_CACHE_TTL_SECONDS = "86400"
TI_STALE_TTL_SECONDS = "604800"
TI_MIN_REMAINING = "25"

[[d1_databases]]
binding = "DB"
database_name = "tisearch"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *"]
